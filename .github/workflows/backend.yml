name: Build 21gateway-back

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and publish 21gateway-back
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Go
        working-directory: backend
        run: |
          go test -race ./...
          go vet ./...
          go build ./cmd/api ./cmd/admin ./cmd/maintenance
      - uses: docker/setup-buildx-action@v4
      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          image=ghcr.io/3035tech/21gateway-back
          tags="${image}:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags="${tags},${image}:hml"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME#v}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.repository_owner == '3035tech'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.repository_owner == '3035tech' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=21gateway-back
            org.opencontainers.image.description=21 Mobile Gateway backend API and workers
