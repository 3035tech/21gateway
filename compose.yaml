services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: 21mobile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 21mobile"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    entrypoint: ["/admin"]
    command: ["-action", "migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/21mobile?sslmode=disable
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/21mobile?sslmode=disable
      API_AUTH_IP_LIMIT_PER_MINUTE: ${API_AUTH_IP_LIMIT_PER_MINUTE:-600}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DOCS_ENABLED: "true"
      COOKIE_SECURE: "false"
      COOKIE_CROSS_SITE: "false"
      CALLBACK_INGRESS_ENABLED: "false"
      MO_INGRESS_ENABLED: "false"
      SCHEDULED_SQS_ENABLED: ${SCHEDULED_SQS_ENABLED:-false}
      SCHEDULED_SQS_QUEUE_URL: ${SCHEDULED_SQS_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULED_CONTENT_KEY: ${SCHEDULED_CONTENT_KEY:-}
      SMS_HISTORY_CONTENT_KEY: ${SMS_HISTORY_CONTENT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SMS_HISTORY_ACTIVE_KEY_ID: ${SMS_HISTORY_ACTIVE_KEY_ID:-}
      SMS_HISTORY_ENCRYPTION_KEYS: ${SMS_HISTORY_ENCRYPTION_KEYS:-}
      SCHEDULED_ACTIVE_KEY_ID: ${SCHEDULED_ACTIVE_KEY_ID:-}
      SCHEDULED_ENCRYPTION_KEYS: ${SCHEDULED_ENCRYPTION_KEYS:-}
      MO_CONTENT_KEY: ${MO_CONTENT_KEY:-}
      WHITELABEL_BASE_URL: ${WHITELABEL_BASE_URL:-https://endpoint.devyx.com.br}
      TEST_SMS_DESTINATION: ${TEST_SMS_DESTINATION:-}
      TEST_SMS_ALLOW_ANY_DESTINATION: ${TEST_SMS_ALLOW_ANY_DESTINATION:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      RECOVERY_SMTP_HOST: ${RECOVERY_SMTP_HOST:-}
      RECOVERY_SMTP_PORT: ${RECOVERY_SMTP_PORT:-}
      RECOVERY_SMTP_USER: ${RECOVERY_SMTP_USER:-}
      RECOVERY_SMTP_PASSWORD: ${RECOVERY_SMTP_PASSWORD:-}
      RECOVERY_SMTP_FROM: ${RECOVERY_SMTP_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PROVIDER_TOKEN_KEY: ${PROVIDER_TOKEN_KEY:-}
      PROVIDER_ACTIVE_KEY_ID: ${PROVIDER_ACTIVE_KEY_ID:-}
      PROVIDER_ENCRYPTION_KEYS: ${PROVIDER_ENCRYPTION_KEYS:-}
      MO_ACTIVE_KEY_ID: ${MO_ACTIVE_KEY_ID:-}
      MO_ENCRYPTION_KEYS: ${MO_ENCRYPTION_KEYS:-}
      MO_FINGERPRINT_KEY: ${MO_FINGERPRINT_KEY:-}
      MO_RETENTION_DAYS: ${MO_RETENTION_DAYS:-90}
      OPERATIONS_ENABLED: ${OPERATIONS_ENABLED:-false}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      HEALTH_DEPENDENCIES_TOKEN_SHA256: ${HEALTH_DEPENDENCIES_TOKEN_SHA256:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend
  backend-test:
    profiles: ["verification"]
    build:
      context: ./backend
      target: verification
    command: ["go", "test", "-race", "-v", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/21mobile?sslmode=disable
      REQUIRE_DATABASE_TESTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
